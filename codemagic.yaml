workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bopinn_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # الملف الجديد (فيه صلاحية الإشعارات) بالاسم، لا يختلط بالقديم.
        provisioning_profiles:
          - fundly_appstore_push
        certificates:
          - bopinn_distribution
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
